<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZeroGuard — Intelligence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── CORE STYLING ────────────────────────────────────── */
:root {
  --bg: #0d1117; --sidebar: #161b22; --border: #30363d;
  --text: #c9d1d9; --accent: #58a6ff; --red: #f85149; --orange: #d29922;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; line-height: 1.5; }

/* ── LAYOUT SHELL ────────────────────────────────────── */
.app-container { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 24px; flex-shrink: 0; display: flex; flex-direction: column; }
.main-content { flex: 1; padding: 32px; min-width: 0; }

.logo-box { text-align: center; margin-bottom: 32px; }
.logo-box img { max-width: 100%; border-radius: 8px; height: auto; }

.nav-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; 
            color: #8b949e; border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: 0.2s; font-weight: 500; }
.nav-item:hover, .nav-item.active { background: #1f242c; color: var(--accent); }
.badge { background: #30363d; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--text); }

/* ── MOBILE & TABLET OPTIMIZATION ────────────────────── */
@media (max-width: 950px) {
  .app-container { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 16px; }
  .nav-group { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .nav-item { margin-bottom: 0; white-space: nowrap; font-size: 13px; flex-shrink: 0; }
  .main-content { padding: 16px; }
  .kpi-grid { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
}

/* ── COMPONENTS ─────────────────────────────────────── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
.kpi-card { background: var(--sidebar); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
.kpi-card h3 { font-size: 11px; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; letter-spacing: 0.5px; }
.kpi-card .val { font-size: 28px; font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #fff; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Table System */
.table-container { background: var(--sidebar); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.table-scroll { overflow-x: auto; width: 100%; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th { background: #0d1117; padding: 14px 20px; text-align: left; font-size: 11px; color: #8b949e; text-transform: uppercase; border-bottom: 1px solid var(--border); }
td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); }
tr:hover td { background: #1f242c; cursor: pointer; }

/* Status Labels */
.status-tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: 1px solid; display: inline-block; }

/* Pagination */
.pagination { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #0d1117; border-top: 1px solid var(--border); }
.pg-btn { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── MODAL (Centered Reversion) ─────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(1, 4, 9, 0.85); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; backdrop-filter: blur(4px); }
.modal-content { background: var(--sidebar); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 650px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 32px; }
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="logo-box">
      <img src="LOGO - dashboard.jpg" alt="ZeroGuard Dashboard">
    </div>
    
    <nav class="nav-group">
      <div class="nav-item active" onclick="switchTab('overview', this)">Overview</div>
      <div class="nav-item" onclick="switchTab('intel', this)">Threat-Intel <span class="badge" id="b-intel">0</span></div>
      <div class="nav-item" onclick="switchTab('it', this)">IT Vulns <span class="badge" id="b-it">0</span></div>
      <div class="nav-item" onclick="switchTab('ot', this)">OT / ICS <span class="badge" id="b-ot">0</span></div>
      <div class="nav-item" onclick="switchTab('con', this)">Consumer <span class="badge" id="b-con">0</span></div>
    </nav>
  </aside>

  <main class="main-content">
    <header style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:32px;">
      <div>
        <h1 id="viewTitle" style="font-size:26px; color:#fff;">Operational Overview</h1>
        <p style="color:#8b949e; font-size:13px; margin-top:4px;">Real-time vulnerability & threat intelligence stream</p>
      </div>
      <button onclick="initSync()" id="syncBtn" style="background:var(--accent); color:#0d1117; font-weight:700; padding:10px 20px; border-radius:6px; border:none; transition: 0.2s;">Refresh Intelligence</button>
    </header>

    <div id="tab-overview" class="tab-content active">
      <div class="kpi-grid">
        <div class="kpi-card"><h3>Total Events</h3><div class="val" id="k-total">0</div></div>
        <div class="kpi-card"><h3>Critical (KEV)</h3><div class="val" id="k-crit" style="color:var(--red)">0</div></div>
        <div class="kpi-card"><h3>Industrial/OT</h3><div class="val" id="k-ot" style="color:var(--orange)">0</div></div>
        <div class="kpi-card"><h3>Intel Reports</h3><div class="val" id="k-intel" style="color:var(--accent)">0</div></div>
      </div>
      
      <div style="background:var(--sidebar); border:1px solid var(--border); padding:24px; border-radius:8px; height:400px;">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <div id="tab-intel" class="tab-content"><div class="table-container" id="cont-intel"></div></div>
    <div id="tab-it" class="tab-content"><div class="table-container" id="cont-it"></div></div>
    <div id="tab-ot" class="tab-content"><div class="table-container" id="cont-ot"></div></div>
    <div id="tab-con" class="tab-content"><div class="table-container" id="cont-con"></div></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="m-id" style="font-family:'JetBrains Mono', monospace; color:var(--accent); margin:0;"></h3>
      <button onclick="closeModal(null, true)" style="color:#8b949e; font-size:28px; background:none; border:none; line-height:1;">&times;</button>
    </div>
    <div class="modal-body">
      <div id="m-date" style="font-size:12px; color:#8b949e; margin-bottom:16px; text-transform:uppercase; letter-spacing:1px;"></div>
      <h2 id="m-title" style="margin-bottom:24px; line-height:1.4; color:#fff;"></h2>
      <p id="m-desc" style="line-height:1.7; margin-bottom:30px; color:#c9d1d9;"></p>
      
      <div style="background:rgba(88,166,255,0.05); border:1px solid rgba(88,166,255,0.2); padding:20px; border-radius:8px; margin-bottom:30px;">
        <h4 style="color:var(--accent); font-size:12px; margin-bottom:10px; text-transform:uppercase;">Remediation / Action</h4>
        <p id="m-action" style="font-size:14px; margin:0;"></p>
      </div>
      
      <a id="m-link" href="#" target="_blank" style="display:inline-block; color:var(--accent); text-decoration:none; font-weight:600; border-bottom: 1px solid transparent; transition: 0.2s;">View Full Advisory Advisory ↗</a>
    </div>
  </div>
</div>

<script>
// Logic State
let store = { all: [], intel: [], it: [], ot: [], con: [] };
let pg = { intel: 1, it: 1, ot: 1, con: 1, limit: 12 };
let chartRef = null;

// OT/ICS Keywords for Auto-Routing
const kwOT = ['siemens','schneider','scada','ics','plc','substation','dnp3','iec 61850','sel ','modbus','industrial','grid','power','abb','honeywell'];
const kwCon = ['android','iphone','smart home','xiaomi','tplink','dlink','windows 10','playstation','xbox','ios','consumer'];

/**
 * Main Data Synchronizer
 */
async function initSync() {
  const sBtn = document.getElementById('syncBtn');
  sBtn.textContent = 'Updating...';
  sBtn.disabled = true;
  
  store = { all: [], intel: [], it: [], ot: [], con: [] };

  try {
    // 1. Fetch CISA KEV (Known Exploited Vulnerabilities)
    const r = await fetch("https://corsproxy.io/?https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json");
    if (r.ok) {
      const j = await r.json();
      j.vulnerabilities.forEach(v => {
        store.all.push({ 
          id: v.cveID, 
          title: v.product, 
          desc: v.shortDescription, 
          action: v.requiredAction, 
          date: v.dateAdded, 
          link: `https://nvd.nist.gov/vuln/detail/${v.cveID}`, 
          status: 'KEV Alert' 
        });
      });
    }
  } catch(e) { console.error("KEV Sync Failed", e); }

  // 2. Fetch Intelligence RSS Feeds
  const feeds = [
    "https://www.us-cert.gov/ncas/alerts.xml", 
    "https://www.bleepingcomputer.com/feed/", 
    "https://www.darkreading.com/rss.xml",
    "https://thehackernews.com/feeds/posts/default"
  ];
  const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";
  
  for (const url of feeds) {
    try {
      const res = await fetch(proxy + encodeURIComponent(url));
      const data = await res.json();
      if(data.items) {
        data.items.forEach(item => {
          store.all.push({ 
            id: 'INTEL-REPORT', 
            title: item.title, 
            desc: item.description.replace(/<[^>]*>/g, '').substring(0, 500), 
            action: 'Review report for Indicators of Compromise (IOCs) and relevant patches.', 
            date: item.pubDate, 
            link: item.link, 
            status: 'Intelligence' 
          });
        });
      }
    } catch(e) { console.warn(`Feed ${url} failed`); }
  }

  // 3. Routing & Sorting (Most recent first)
  store.all.sort((a,b) => new Date(b.date) - new Date(a.date));
  
  store.all.forEach(item => {
    if (item.id === 'INTEL-REPORT') {
      store.intel.push(item);
    } else {
      const combinedTxt = (item.title + " " + item.desc).toLowerCase();
      if (kwOT.some(k => combinedTxt.includes(k))) store.ot.push(item);
      else if (kwCon.some(k => combinedTxt.includes(k))) store.con.push(item);
      else store.it.push(item); // Default to IT
    }
  });

  refreshDashboard();
  sBtn.textContent = 'Refresh Intelligence';
  sBtn.disabled = false;
}

/**
 * UI Rendering Logic
 */
function refreshDashboard() {
  ['intel','it','ot','con'].forEach(t => {
    document.getElementById(`b-${t}`).textContent = store[t].length;
    renderTabTable(t);
  });
  
  document.getElementById('k-total').textContent = store.all.length;
  document.getElementById('k-crit').textContent = store.all.filter(x => x.status === 'KEV Alert').length;
  document.getElementById('k-ot').textContent = store.ot.length;
  document.getElementById('k-intel').textContent = store.intel.length;
  
  renderMainChart();
}

function renderTabTable(tabId) {
  const container = document.getElementById(`cont-${tabId}`);
  const data = store[tabId];
  const totalPages = Math.ceil(data.length / pg.limit) || 1;
  
  // Dynamic page reset if current page exceeds new total
  if (pg[tabId] > totalPages) pg[tabId] = 1;

  const currentSlice = data.slice((pg[tabId] - 1) * pg.limit, pg[tabId] * pg.limit);

  container.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Identifier</th>
            <th>Summary / Asset</th>
            <th>Publication Date</th>
            <th>Source Status</th>
          </tr>
        </thead>
        <tbody>
          ${currentSlice.map(i => `
            <tr onclick='openModal(${JSON.stringify(i).replace(/'/g, "&apos;")})'>
              <td style="color:var(--accent); font-family:'JetBrains Mono'; font-weight:500;">${i.id}</td>
              <td style="max-width:380px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${i.title}</td>
              <td style="color:#8b949e">${new Date(i.date).toISOString().split('T')[0]}</td>
              <td>
                <span class="status-tag" style="color:${i.status==='KEV Alert'?'#f85149':'#d29922'}; border-color:currentColor">
                  ${i.status}
                </span>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="pg-btn" onclick="changePage('${tabId}', -1)" ${pg[tabId] === 1 ? 'disabled' : ''}>Previous</button>
      <span style="font-size:12px; color:#8b949e">Page ${pg[tabId]} of ${totalPages}</span>
      <button class="pg-btn" onclick="changePage('${tabId}', 1)" ${pg[tabId] === totalPages ? 'disabled' : ''}>Next</button>
    </div>
  `;
}

function changePage(tab, direction) {
  pg[tab] += direction;
  renderTabTable(tab);
}

function switchTab(id, navElement) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  
  document.getElementById(`tab-${id}`).classList.add('active');
  navElement.classList.add('active');
  
  document.getElementById('viewTitle').textContent = (id === 'overview' ? 'Operational Overview' : id.toUpperCase() + " Feed");
}

function openModal(data) {
  document.getElementById('m-id').textContent = data.id;
  document.getElementById('m-date').textContent = `Sync Date: ${data.date}`;
  document.getElementById('m-title').textContent = data.title;
  document.getElementById('m-desc').textContent = data.desc;
  document.getElementById('m-action').textContent = data.action;
  document.getElementById('m-link').href = data.link;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal(event, force) {
  if (force || event.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').style.display = 'none';
  }
}

function renderMainChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  if (chartRef) chartRef.destroy();
  
  chartRef = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Intelligence', 'IT Infrastructure', 'Industrial (OT)', 'Consumer'],
      datasets: [{
        data: [store.intel.length, store.it.length, store.ot.length, store.con.length],
        backgroundColor: ['#58a6ff', '#8957e5', '#d29922', '#238636'],
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
        x: { grid: { display: false }, ticks: { color: '#8b949e' } }
      }
    }
  });
}

// Kick off first sync
initSync();
</script>
</body>
</html>
