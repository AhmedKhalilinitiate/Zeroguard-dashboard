name: Verify ZeroGuard app
on:
  push:
    branches: [main, 'feat/**', 'improve/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: App syntax and basic integration tests
        run: |
          node tests/integrity.test.cjs
          node tests/app.test.cjs
          node tests/matcher.test.cjs
      - name: Install isolated DOM browser harness
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise all ten application tabs
        run: node tests/browser.test.cjs
      - name: Snapshot validation, when data is present
        run: python scripts/validate.py
