name: Intelligence assurance tests
on:
  push:
    branches: ['feat/intelligence-assurance-engine', main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/validate.py
      - run: node tests/matcher.test.cjs
      - run: node tests/integrity.test.cjs
      - run: node tests/app.test.cjs
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node tests/browser.test.cjs
