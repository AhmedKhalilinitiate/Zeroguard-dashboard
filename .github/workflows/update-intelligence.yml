name: Update verified threat intelligence
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zeroguard-intelligence
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch authoritative sources
        env:
          NVD_DAYS: '7'
        run: python scripts/ingest.py
      - name: Validate generated data
        run: python scripts/validate.py
      - name: Commit validated snapshot
        run: |
          git config user.name "zeroguard-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intelligence.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified threat intelligence"
            git push
          fi
